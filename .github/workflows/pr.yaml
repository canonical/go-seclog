name: Unit tests

on:
  push:
  pull_request:
    branches:
      - 'main'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Test with the Go CLI
        run: go test ./...
      - name: Report coverage
        run: |
          go test -coverprofile=coverage.out ./...
          {
            echo "## Test coverage"
            echo
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
